name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate skill structure
        run: python3 scripts/validate.py

      - name: Smoke-test the project scanner
        run: |
          python3 scripts/scan_project.py . --task "validate routing" > /tmp/scan.md
          test -s /tmp/scan.md
          grep -q "Suggested modules" /tmp/scan.md
